name: Build release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        # Avoid the macOS ARM pool, which can fail before acquiring a runner.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: mochi-${{ runner.os }}
          path: |
            .mochi/target/release/mochi
            .mochi/target/release/mochi.exe
          include-hidden-files: true
