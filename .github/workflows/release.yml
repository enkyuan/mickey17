name: Build release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: perfectclone-${{ runner.os }}
          path: |
            target/release/perfectclone
            target/release/perfectclone.exe
