[package]
name = "mochi-web"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "Browser-rendered website mirroring and hydration-aware editing"
license = "MIT"
repository = "https://github.com/enkyuan/mochi"
readme = "README.md"
exclude = ["/.github/**", "/.gstack/**", "/.mochi/**", "/.editorconfig"]

[lib]
name = "mochi"

[[bin]]
name = "mochi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
headless_chrome = "1.0.22"
html-escape = "0.2"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json"] }
robotstxt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
url = { version = "2", features = ["serde"] }
walkdir = "2"
tempfile = "3"
sha2 = "0.10"
oxc_allocator = "0.157.0"
oxc_ast = "0.157.0"
oxc_parser = "0.157.0"
oxc_span = "0.157.0"
oxc_codegen = "0.157.0"
oxc_ast_visit = "0.157.0"
oxc_semantic = "0.157.0"
scraper = "0.29.0"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
criterion = "0.8.2"
dhat = "0.3.3"
http-body-util = "0.1"
png = "0.18"

[[bench]]
name = "editing"
harness = false

[profile.release]
debug = 1

[lints.rust]
unsafe_code = "forbid"
