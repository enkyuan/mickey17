[package]
name = "mochi-web"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "Browser-rendered website mirroring and hydration-aware editing"
license = "MIT"
repository = "https://github.com/enkyuan/mochi"
readme = "README.md"
exclude = ["/.github/**", "/.gstack/**", "/.mochi/**", "/.editorconfig"]

[lib]
name = "mochi"

[[bin]]
name = "mochi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
headless_chrome = "1.0.22"
html-escape = "0.2"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json"] }
robotstxt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
url = { version = "2", features = ["serde"] }
walkdir = "2"
tempfile = "3"
sha2 = "0.10"
oxc_allocator = "0.157.0"
oxc_ast = "0.157.0"
oxc_parser = "0.157.0"
oxc_span = "0.157.0"
oxc_codegen = "0.157.0"
oxc_ast_visit = "0.157.0"
oxc_semantic = "0.157.0"
scraper = "0.29.0"
# Already in the dependency tree through scraper (same version, MPL-2.0); used directly as the CSS tokenizer
# for the token pipeline. lightningcss is not vendored and would add a large dependency tree.
cssparser = "0.38"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
criterion = "0.8.2"
dhat = "0.3.3"
http-body-util = "0.1"
png = "0.18"

[[bench]]
name = "editing"
harness = false

# Dev/test builds dominate the Cargo cache in .mochi/cache/target. Full debuginfo for every
# dependency was most of it. One-off measurements on one macOS machine (not reproducible from
# the repository; sizes drift with the dependency set and seconds were taken while other builds
# ran), with `cargo test --no-run` into a fresh target dir each time:
#   default (debug = 2)                          3.68 GB  clean 211 s  rebuild 24 s
#   debug = "line-tables-only" everywhere        3.10 GB  clean 193 s  rebuild 12 s
#   line tables for mochi-web, none for deps     2.64 GB  clean  85 s  rebuild 11 s   <- chosen
#   ... plus incremental = false                 2.29 GB  clean 123 s  rebuild 37 s
#   debug = 0 everywhere                         2.48 GB  clean 233 s  rebuild 14 s
# Incremental stays on: turning it off saves another ~0.35 GB but made rebuilds ~3x slower.
# Backtraces keep file:line for mochi-web frames; dependency frames show function names only.
# split-debuginfo is left at the macOS default (unpacked). To reclaim space: see docs/workspace.md
# (`cargo clean -p mochi-web`, `mochi clean --cargo`).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
debug = 1

[lints.rust]
unsafe_code = "forbid"
